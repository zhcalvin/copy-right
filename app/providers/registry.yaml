# Provider registry: the ONLY place model IDs and endpoints may live.
#
# Adding a provider = one adapter module + one entry here.
#
# `adapter` is "module:Class". Providers with `adapter: null` are listed in the UI
# but not implemented yet. Before implementing one, check the provider's official
# docs for current model IDs, endpoints, auth and input limits, then fill `models`.
# Model lists are intentionally empty until verified (see docs/PLAN.md §1 rule 2).
#
# `connection_test` is a free, read-only request used by the setup wizard before a full
# adapter exists (see ConnectionTestSpec in registry.py). Endpoints checked against the
# official docs on 2026-10-13. A provider without one shows "no connection test yet".

providers:
  mock:
    name: Demo (mock)
    region: any
    adapter: app.providers.mock.adapter:MockAdapter
    description: Returns fixed samples. No key needed; for demos and development.
    i18n: {zh-CN: {name: 演示（Mock）, description: 返回固定样例，不需要 key，用于演示和开发。}}
    docs: null
    capabilities: [video_understanding, llm_text, image_edit, video_edit_v2v, image_to_video, tts, lipsync, asr]
    credentials: []
    models:
      video_understanding: [{id: mock-vu, name: Mock video understanding}]
      llm_text: [{id: mock-llm, name: Mock text}]
      image_edit: [{id: mock-image, name: Mock image edit}]
      video_edit_v2v: [{id: mock-v2v, name: Mock video edit}]
      image_to_video: [{id: mock-i2v, name: Mock image to video}]
      tts: [{id: mock-tts, name: Mock speech}]
      lipsync: [{id: mock-lipsync, name: Mock lip-sync}]
      asr: [{id: mock-asr, name: Mock speech recognition}]

  # ---------------------------------------------------------------- 国内 (cn)
  dashscope:
    name: Alibaba Cloud Model Studio (DashScope)
    region: cn
    adapter: app.providers.dashscope.adapter:DashScopeAdapter
    description: Qwen-VL, Qwen, Wan and Paraformer. One key covers several capabilities.
    i18n: {zh-CN: {name: 阿里云百炼, description: 通义千问 VL / 通义千问 / 通义万相 / Paraformer，一个 key 覆盖多个能力。}}
    docs: https://help.aliyun.com/zh/model-studio/
    capabilities: [video_understanding, llm_text, image_edit, video_edit_v2v, image_to_video, tts, asr]
    credentials:
      - {name: api_key, label: API Key, env: DASHSCOPE_API_KEY}
      # Beijing workspaces may use https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      - {name: base_url, label: Base URL, secret: false, required: false, env: DASHSCOPE_BASE_URL, default: "https://dashscope.aliyuncs.com/compatible-mode/v1"}
    # Video-capable models listed by GET /models and the vision docs on 2026-10-14.
    # The first entry is the default. Implemented: video_understanding, image_edit,
    # video_edit_v2v (character swap), image_to_video.
    models:
      video_understanding:
        - {id: qwen3.6-plus, name: Qwen3.6 Plus}
        - {id: qwen3.7-plus, name: Qwen3.7 Plus}
        - {id: qwen3.6-flash, name: Qwen3.6 Flash (cheaper)}
        - {id: qwen3-vl-plus, name: Qwen3-VL Plus}
      llm_text:
        - {id: qwen3.6-plus, name: Qwen3.6 Plus}
        - {id: qwen3.6-flash, name: Qwen3.6 Flash (cheaper)}
        - {id: qwen3.7-plus, name: Qwen3.7 Plus}
      # https://help.aliyun.com/zh/model-studio/qwen-image-edit-api (2026-10-14)
      image_edit:
        - {id: qwen-image-2.0-pro, name: Qwen-Image 2.0 Pro}
        - {id: qwen-image-2.0, name: Qwen-Image 2.0 (faster)}
      # `modes` says which treatments a model serves (swap, edit, motion).
      # https://help.aliyun.com/zh/model-studio/wan-animate-mix-api (2026-10-14):
      # replaces the character in a 2–30 s clip, keeping its motion and camera.
      # https://www.alibabacloud.com/help/zh/model-studio/wan-video-editing-api-reference
      # (2026-10-16): instruction edits of a 2–10 s clip with up to 4 reference images.
      video_edit_v2v:
        - {id: wan2.2-animate-mix, name: Wan 2.2 Animate (character swap), modes: [swap]}
        - {id: wan2.7-videoedit, name: Wan 2.7 video edit (instructions, several people), modes: [edit]}
        - {id: wan2.2-animate-move, name: Wan 2.2 Animate (move a new image), modes: [motion]}
      # https://help.aliyun.com/zh/model-studio/image-to-video-api-reference/ (2026-10-14)
      image_to_video:
        - {id: wan2.6-i2v, name: Wan 2.6 image to video}
        - {id: wan2.6-i2v-flash, name: Wan 2.6 image to video (flash)}
    connection_test:
      url: "{base_url}/models"
      headers: {Authorization: "Bearer {api_key}"}

  volcengine:
    name: Volcengine Ark
    region: cn
    adapter: null
    description: Doubao vision and LLMs, Seedream, Seedance.
    i18n: {zh-CN: {name: 火山方舟, description: 豆包视觉理解、豆包大模型、Seedream、Seedance。}}
    docs: https://www.volcengine.com/docs/82379
    capabilities: [video_understanding, llm_text, image_edit, image_to_video, tts, asr]
    credentials:
      - {name: api_key, label: API Key, env: ARK_API_KEY}
    models: {}

  kling:
    name: Kling
    region: cn
    adapter: null
    description: First/last-frame image to video, lip-sync.
    i18n: {zh-CN: {name: 可灵, description: 首尾帧图生视频、对口型。}}
    docs: https://kling.ai/document-api/api/get-started/authentication
    capabilities: [image_to_video, video_edit_v2v, lipsync]
    # The single API Key is the current scheme; AK/SK only covers legacy APIs.
    credentials:
      - {name: api_key, label: API Key, env: KLING_API_KEY}
      - {name: base_url, label: Base URL, secret: false, required: false, env: KLING_BASE_URL, default: "https://api-beijing.klingai.com"}
    models: {}
    connection_test:
      url: "{base_url}/account/costs"
      headers: {Authorization: "Bearer {api_key}"}
      query: {start_time: "{day_ago_ms}", end_time: "{now_ms}"}

  minimax:
    name: MiniMax
    region: cn
    adapter: null
    description: Speech synthesis with voice cloning, Hailuo video.
    i18n: {zh-CN: {name: MiniMax, description: 语音合成与音色克隆、海螺视频。}}
    docs: https://platform.minimaxi.com/document
    capabilities: [tts, image_to_video]
    credentials:
      - {name: api_key, label: API Key, env: MINIMAX_API_KEY}
      - {name: base_url, label: Base URL, secret: false, required: false, env: MINIMAX_BASE_URL, default: "https://api.minimax.cn"}
    models: {}
    connection_test:
      url: "{base_url}/v1/models"
      headers: {Authorization: "Bearer {api_key}"}

  # ------------------------------------------------------------ 海外 (global)
  gemini:
    name: Google Gemini
    region: global
    adapter: app.providers.gemini.adapter:GeminiAdapter
    description: Native video input with structured JSON output; image models; Veo video generation.
    i18n: {zh-CN: {name: Google Gemini, description: 原生视频输入与结构化 JSON 输出；图像模型；Veo 视频生成。}}
    docs: https://ai.google.dev/gemini-api/docs
    capabilities: [video_understanding, llm_text, image_edit, image_to_video, asr]
    credentials:
      - {name: api_key, label: API Key, env: GEMINI_API_KEY}
      - {name: base_url, label: Base URL, secret: false, required: false, env: GEMINI_BASE_URL, default: "https://generativelanguage.googleapis.com/v1beta"}
    # From https://ai.google.dev/gemini-api/docs/models on 2026-10-14. Not live-tested yet.
    models:
      video_understanding:
        - {id: gemini-3.8-flash, name: Gemini 3.8 Flash}
        - {id: gemini-3.5-flash-lite, name: Gemini 3.5 Flash-Lite (cheaper)}
      llm_text:
        - {id: gemini-3.8-flash, name: Gemini 3.8 Flash}
        - {id: gemini-3.5-flash-lite, name: Gemini 3.5 Flash-Lite (cheaper)}
    connection_test:
      url: "{base_url}/models"
      headers: {x-goog-api-key: "{api_key}"}
      status: {400: auth_error}  # an invalid key comes back as 400 API_KEY_INVALID

  runway:
    name: Runway
    region: global
    adapter: null
    description: Aleph video editing, Gen image to video.
    i18n: {zh-CN: {name: Runway, description: Aleph 视频编辑、Gen 系列图生视频。}}
    docs: https://docs.dev.runwayml.com/
    capabilities: [video_edit_v2v, image_to_video]
    credentials:
      - {name: api_key, label: API Secret, env: RUNWAYML_API_SECRET}
    models: {}
    connection_test:
      url: https://api.dev.runwayml.com/v1/organization
      headers: {Authorization: "Bearer {api_key}", X-Runway-Version: "2024-11-06"}

  fal:
    name: fal.ai
    region: global
    adapter: null
    description: Hosted open models (Wan, FLUX, lip-sync and more). A catch-all fallback.
    i18n: {zh-CN: {name: fal.ai, description: 托管开源模型（Wan、FLUX、对口型等），可作为海外万能备选。}}
    docs: https://docs.fal.ai/
    capabilities: [image_edit, video_edit_v2v, image_to_video, lipsync]
    credentials:
      - {name: api_key, label: API Key, env: FAL_KEY}
    models: {}
    connection_test:
      url: https://api.fal.ai/v1/account/billing
      headers: {Authorization: "Key {api_key}"}
      status: {403: ok}  # key is valid but lacks the billing:usage:read scope

  elevenlabs:
    name: ElevenLabs
    region: global
    adapter: null
    description: Speech synthesis and voice cloning.
    i18n: {zh-CN: {name: ElevenLabs, description: 语音合成与声音克隆。}}
    docs: https://elevenlabs.io/docs
    capabilities: [tts]
    credentials:
      - {name: api_key, label: API Key, env: ELEVENLABS_API_KEY}
    models: {}
    connection_test:
      url: https://api.elevenlabs.io/v1/user
      headers: {xi-api-key: "{api_key}"}

  synclabs:
    name: Sync Labs
    region: global
    adapter: null
    description: Lip-sync (sync.so).
    i18n: {zh-CN: {name: Sync Labs, description: 对口型（sync.so）。}}
    docs: https://docs.sync.so/
    capabilities: [lipsync]
    credentials:
      - {name: api_key, label: API Key, env: SYNC_API_KEY}
    models: {}
    connection_test:
      url: https://api.sync.so/v2/models
      headers: {x-api-key: "{api_key}"}

# Object storage for providers that only accept public URLs (docs/PLAN.md §4).
storage:
  provider_upload:
    name: Provider's own upload
    description: Each provider's own file upload API. Nothing to configure.
    i18n: {zh-CN: {name: 使用供应商自带上传, description: 由各供应商的文件上传接口处理，不需要额外配置。}}
    credentials: []
  s3:
    name: S3 / Cloudflare R2
    description: S3-compatible storage with presigned URLs valid for 1 hour.
    i18n: {zh-CN: {name: S3 / Cloudflare R2, description: S3 兼容存储，生成 1 小时有效的预签名 URL。}}
    docs: https://developers.cloudflare.com/r2/api/s3/
    credentials:
      - {name: endpoint, label: Endpoint, secret: false, env: COPYRIGHT_S3_ENDPOINT}
      - {name: region, label: Region, secret: false, required: false, env: COPYRIGHT_S3_REGION, default: auto}
      - {name: bucket, label: Bucket, secret: false, env: COPYRIGHT_S3_BUCKET}
      - {name: access_key_id, label: Access Key ID, env: COPYRIGHT_S3_ACCESS_KEY_ID}
      - {name: secret_access_key, label: Secret Access Key, env: COPYRIGHT_S3_SECRET_ACCESS_KEY}
  oss:
    name: Alibaba Cloud OSS
    description: Signed URLs valid for 1 hour.
    i18n: {zh-CN: {name: 阿里云 OSS, description: 生成 1 小时有效的签名 URL。}}
    docs: https://help.aliyun.com/zh/oss/
    credentials:
      - {name: endpoint, label: Endpoint, secret: false, env: COPYRIGHT_OSS_ENDPOINT}
      - {name: bucket, label: Bucket, secret: false, env: COPYRIGHT_OSS_BUCKET}
      - {name: access_key_id, label: AccessKey ID, env: COPYRIGHT_OSS_ACCESS_KEY_ID}
      - {name: access_key_secret, label: AccessKey Secret, env: COPYRIGHT_OSS_ACCESS_KEY_SECRET}

# Presets prefill one provider per capability (docs/PLAN.md §4). `null` = not used.
presets:
  cn:
    name: China preset
    description: DashScope, Volcengine Ark, Kling, MiniMax
    i18n: {zh-CN: {name: 国内套餐, description: 百炼、火山方舟、可灵、MiniMax}}
    capabilities:
      video_understanding: dashscope
      llm_text: dashscope
      image_edit: dashscope
      video_edit_v2v: dashscope
      image_to_video: kling
      tts: minimax
      lipsync: kling
      asr: dashscope
  global:
    name: Global preset
    description: Gemini, Runway, fal, ElevenLabs, Sync Labs
    i18n: {zh-CN: {name: 海外套餐, description: Gemini、Runway、fal、ElevenLabs、Sync Labs}}
    capabilities:
      video_understanding: gemini
      llm_text: gemini
      image_edit: gemini
      video_edit_v2v: runway
      image_to_video: gemini
      tts: elevenlabs
      lipsync: synclabs
      asr: gemini
  demo:
    name: Demo mode
    description: Everything uses mock adapters. No keys needed.
    i18n: {zh-CN: {name: 演示模式, description: 全部使用 mock，不需要任何 key}}
    capabilities:
      video_understanding: mock
      llm_text: mock
      image_edit: mock
      video_edit_v2v: mock
      image_to_video: mock
      tts: mock
      lipsync: mock
      asr: mock
